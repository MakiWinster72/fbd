[project]
name = "knowledge-rag"
version = "0.1.0"
description = "支持文档解析、切块、向量检索与引用问答的私有知识库系统"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
milvus = ["pymilvus>=2.6,<3"]
test = ["httpx>=0.28,<1"]

[project.scripts]
knowledge-rag = "knowledge_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
